name: Verify

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint del repo (frontmatter, refs, kits, README)
        run: node .opencode/verify-install.js --repo-only

      - name: Instalar en un HOME limpio y verificar sincronía
        run: |
          TMP_HOME="$(mktemp -d)"
          HOME="$TMP_HOME" bash install.sh -y --global
          node .opencode/verify-install.js --config "$TMP_HOME/.config/opencode"

      - name: Test suite del instalador bash
        run: bash test-install.sh

      - name: Scripts con bit ejecutable
        run: |
          findings=0
          for f in skills/*/scripts/*.py skills/*/scripts/*.sh; do
            [ -e "$f" ] || continue
            if [ ! -x "$f" ]; then
              echo "::error file=$f::falta bit ejecutable"
              findings=1
            fi
          done
          exit "$findings"
